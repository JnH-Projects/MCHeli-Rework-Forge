org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# Mod coordinates, shared by every platform module
mod_id=mcheli
mod_name=MCHeli Rework
mod_group=com.jnhprojects.mcheli
mod_version=1.1.0-beta.1
mod_authors=JayMar921 (rework), EMB4 (original author), Fureniku (CurseForge maintainer)
mod_license=MCHeli Rework Licence 1.0 (see LICENSE)

# Platform modules built by this project, one per Minecraft version. Each has its own
# gradle.properties with the Minecraft, loader and Java versions.
platforms=forge-26.3

# Libraries the common module compiles against. Every supported Minecraft version ships them.
slf4j_version=2.0.17
jspecify_version=1.0.1
joml_version=1.10.9
junit_version=5.13.4
