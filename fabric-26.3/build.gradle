plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/loader.gradle')

// The original MCHeli 1.0.3 download. Players supply their own copy; development runs use this
// one (git-ignored, see docs/DEVELOPMENT.md).
def legacyZip = rootProject.file('Mod/MC1.7.10_mcheli_1.0.3.zip').absolutePath

loom {
    runs {
        configureEach {
            runDir = '../run'
            vmArg "-Dmcheli.legacyZip=${legacyZip}"
        }
        server {
            programArgs '--nogui'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
