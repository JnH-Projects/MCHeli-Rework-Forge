plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle'
}

version = mod_version
group = mod_group

base {
    archivesName = "mcheli-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

// The shared code is compiled into this module rather than depended on, so the mod stays one
// jar and one module in development runs. The common project checks on its own that these
// sources need nothing from Minecraft.
def common = project(':common')
sourceSets.main.java.srcDir(common.file('src/main/java'))
sourceSets.main.resources.srcDir(common.file('src/main/resources'))

// The original MCHeli 1.0.3 download. Players supply their own copy; development runs use this
// one (git-ignored, see docs/DEVELOPMENT.md).
def legacyZip = rootProject.file('Mod/MC1.7.10_mcheli_1.0.3.zip').absolutePath

minecraft {
    runs {
        configureEach {
            workingDir = rootProject.layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'mcheli.legacyZip', legacyZip
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

def expandProps = [
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_version          : version,
        mod_authors          : mod_authors,
        mod_license          : mod_license,
        minecraft_version_range: minecraft_version_range,
        forge_version_range  : forge_version_range,
        loader_version_range : loader_version_range,
]

tasks.named('processResources', ProcessResources) {
    inputs.properties(expandProps)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

tasks.named('jar', Jar) {
    // EMB4's content is never redistributed: players import it from their own copy of the original
    // zip (LegacyContent). The repository no longer holds it, but the jar is packed from
    // build/sourceSets/main, which can still have copies from older builds and from the IDE.
    def shipped = ['assets/mcheli/items/helicopter.json', 'assets/mcheli/items/plane.json',
                   'assets/mcheli/items/tank.json', 'assets/mcheli/items/vehicle.json']
    exclude { FileTreeElement element ->
        String path = element.relativePath.pathString
        !element.directory && path.startsWith('assets/mcheli/') && !path.startsWith('assets/mcheli/lang/') &&
                !shipped.contains(path)
    }
    exclude 'data/mcheli/recipe/**'
    includeEmptyDirs = false
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : 'JnH Projects',
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': version,
                'Implementation-Vendor' : 'JnH Projects',
                'Minecraft-Version'     : minecraft_version,
        ])
    }
}
